<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Puente Viejo</title>
    
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/css/login_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="carousel-background">
        <div class="carousel-slide active" style="background-image: url('/static/familia.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('/static/comida.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('/static/picacho.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('/static/pa.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('/static/familia.jpg');"></div>
    </div>
    
    <div class="overlay"></div>

    <div class="door-frame door-left"></div>
    <div class="door-frame door-right"></div>

    <div class="main-container">
        
        <div class="welcome-section">
            <h1>Bienvenido<br>de nuevo</h1>
            
            <div class="social-icons">
                <a href="https://www.facebook.com/PuenteViejoAgs?locale=es_LA" target="_blank" rel="noopener noreferrer" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/puente_viejo_picacho" target="_blank" rel="noopener noreferrer" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>

        <div class="login-section">
            <div class="login-panel">
                <div class="login-logo">
                    <img src="/static/logo.png" alt="Puente Viejo" width="150">
                </div>
                
                <h3 class="login-title">Iniciar sesión</h3>

                <div id="login-error" class="flash-messages" style="display: none; color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    <i class="fas fa-exclamation-circle"></i> <span id="login-error-text"></span>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon" style="position: absolute; left: 10px; top: 12px; color: #ccc;"></i>
                            <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required style="padding-left: 35px;">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper" style="position: relative;">
                            <i class="fas fa-lock input-icon" style="position: absolute; left: 10px; top: 12px; color: #ccc;"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••" required style="padding-left: 35px;">
                        </div>
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox" name="remember"> Recordarme
                        </label>
                    </div>

                    <button type="submit" class="btn-login">Ingresar al Sistema <i class="fas fa-arrow-right"></i></button>
                </form>

                <div style="text-align: center; margin-top: 15px; font-size: 0.85em; color: var(--marron-claro, #7f8c8d);">
                    Gestor Financiero & Operativo v4.0 Ric G<br>
                    <a href="/templates/terminos.html" style="color: var(--naranja-quemado, #d35400); text-decoration: none; font-weight: bold;">Términos</a> 
                    | 
                    <a href="/templates/privacidad.html" style="color: var(--naranja-quemado, #d35400); text-decoration: none; font-weight: bold;">Privacidad</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.carousel-slide');
            let currentSlide = 0;

            function nextSlide() {
                if (slides.length === 0) return;
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }

            if (slides.length > 1) {
                setInterval(nextSlide, 5000);
            }
        });
    </script>
    <!-- Script con la ubicación exacta -->
    <script src="/static/js/auth.js"></script>
</body>
</html>

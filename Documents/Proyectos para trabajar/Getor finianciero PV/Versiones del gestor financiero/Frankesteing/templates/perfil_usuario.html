<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Puente Viejo</title>
    <link rel="icon" href="/static/logo.png">
    
    <link rel="stylesheet" href="/static/css/1_base.css">
    <link rel="stylesheet" href="/static/css/2_layout.css">
    <link rel="stylesheet" href="/static/css/3_components.css">
    <link rel="stylesheet" href="/static/css/4_forms_tables.css">
    <link rel="stylesheet" href="/static/css/5_pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Menú Principal</h2>
            </div>
            <nav class="sidebar-nav">
                <ul id="main-menu">
                    <li class="admin-only"><a href="/templates/usuarios.html"><i class="fas fa-users-cog"></i><span>Usuarios</span></a></li>
                    <li><a href="/templates/index.html"><i class="fas fa-home"></i><span>Inicio</span></a></li>
                    <li><a href="/templates/registro_movimientos.html"><i class="fas fa-exchange-alt"></i><span>Registro</span></a></li>
                    <li><a href="/templates/generacion_reportes.html"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
                    <li><a href="/templates/cuentas_por_pagar.html"><i class="fas fa-file-invoice-dollar"></i><span>Cuentas</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div class="header-title">
                        <h1>Mi Perfil</h1>
                    </div>
                </div>
                
                <div class="user-menu-container">
                    <div class="user-trigger" onclick="toggleUserMenu()">
                        <div class="header-logo">
                            <img src="/static/logo.png" alt="Logo">
                        </div>
                        <span style="margin-left:10px; font-weight:bold; color:var(--marron-oscuro); cursor: pointer;">
                            <span id="user-name-display">Cargando...</span> <i class="fas fa-caret-down"></i>
                        </span>
                    </div>
                    <div id="user-dropdown" class="user-dropdown-content">
                        <a href="/templates/perfil_usuario.html"><i class="fas fa-user-cog"></i> Configurar Usuario</a>
                        <a href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="form-container" style="max-width: 600px; margin: 0 auto;">
                    <h3><i class="fas fa-id-card"></i> Datos de la Cuenta</h3>

                    <form id="perfil-form">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" id="perfil-nombre" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Usuario (Login)</label>
                            <input type="text" id="perfil-username" required>
                        </div>

                        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">
                        <h4 style="color: var(--naranja-quemado); margin-bottom: 20px;">Seguridad (Cambio de Contraseña)</h4>

                        <div class="form-group">
                            <label style="color: #c0392b;">Contraseña Actual (Requerida para guardar cambios)</label>
                            <input type="password" id="password_actual" required placeholder="Ingresa tu contraseña actual">
                        </div>

                        <div class="form-group">
                            <label>Nueva Contraseña (Opcional)</label>
                            <input type="password" id="nueva_password" placeholder="Dejar en blanco si no deseas cambiarla">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
    

    <script src="/static/js/perfil.js"></script>
    <script src="/static/menu.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
